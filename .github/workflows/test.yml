name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ruby ${{ matrix.combo.ruby }} / ${{ matrix.database }} / ActiveRecord ${{ matrix.combo.activerecord }}
    # Ubuntu 22.04 still provides the older Rubies.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, postgres]
        # Explicit pairs: ActiveRecord 7.x needs Ruby 3.1+, and 6.1 is the oldest version the specs support.
        combo:
          - { ruby: "2.7", activerecord: "6.1.7.10" }
          - { ruby: "3.0", activerecord: "6.1.7.10" }
          - { ruby: "3.1", activerecord: "6.1.7.10" }
          - { ruby: "3.1", activerecord: "7.0.8.7" }
          - { ruby: "3.1", activerecord: "7.1.5.2" }
          - { ruby: "3.1", activerecord: "7.2.3.2" }
          - { ruby: "3.2", activerecord: "6.1.7.10" }
          - { ruby: "3.2", activerecord: "7.0.8.7" }
          - { ruby: "3.2", activerecord: "7.1.5.2" }
          - { ruby: "3.2", activerecord: "7.2.3.2" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: ${{ matrix.combo.ruby }}

      - name: Install the MySQL client library
        if: matrix.database == 'mysql'
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev

      # script/test-docker starts the database container itself, so the workflow and local runs stay identical.
      - name: Run the specs
        run: script/test-docker ${{ matrix.database }} ${{ matrix.combo.activerecord }}
